/*  DATE HELPERS                                                       */
/* ------------------------------------------------------------------ */

const dayKey = (d) => {
  const x = new Date(d);
  return (
    x.getFullYear() +
    "-" +
    String(x.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(x.getDate()).padStart(2, "0")
  );
};

const mondayOf = (d) => {
  const x = new Date(d);
  const day = x.getDay(); // 0 Sun
  const diff = day === 0 ? -6 : 1 - day;
  x.setDate(x.getDate() + diff);
  x.setHours(0, 0, 0, 0);
  return x;
};

const weekNumber = (today, anchorStr) => {
  const anchor = mondayOf(new Date(anchorStr + "T00:00:00"));
  const thisMon = mondayOf(today);
  const diff = Math.round((thisMon - anchor) / (7 * 24 * 3600 * 1000));
  return diff + 1; // week 1 = anchor week
};

function sessionsForDay(dow, weekNum, tennisCount) {
  // 2x Norwegian 4×4 per week (Tue + Fri). Week 8 of each 8-week cycle = deload (intervals session only).
  const cycleWeek = ((((weekNum - 1) % 8) + 8) % 8) + 1;
  const hiitKey = cycleWeek === 8 ? "deload" : "hiit44";

  switch (dow) {
    case 1: return { main: ["pull"], note: null };
    case 2: return { main: [hiitKey], note: "First of two Norwegian 4×4 sessions this week (second is Friday)." };
    case 3: return { main: ["legs", "tennis"], note: "Power/plyometrics, hip hinge, and tennis-functional core this morning — stay sub-maximal, tennis is tonight at 8pm. High-intensity exposures this week: Tuesday's 4×4, tonight's tennis, Friday's 4×4. Fast wind-down after: home ~22:00, lights out 22:30." };
    case 4: return { main: ["push"], note: null };
    case 5: return { main: [hiitKey], note: "Second Norwegian 4×4 session this week." };
    case 6:
      if (tennisCount >= 2)
        return { main: ["longz2"], note: "Tennis cap (2/week) reached. Long Zone 2 today." };
      return {
        main: ["tennis", "longz2"],
        note: "Choose one: tennis (2nd of the week, cap 2) OR long Zone 2 75-90 min. A tennis Saturday means no long Zone 2 this week — accepted trade-off, logged 5 Jul 2026.",
        choice: true,
      };
    case 0:
      return { main: ["rest"], note: "Rest + meal prep day. Sunday reflective review in Notion. No training — accessories below are optional." };
    default: return { main: ["rest"], note: null };
  }
}

function coreCyclePhase(weekNum) {
  const w = Math.max(1, weekNum);
  // Hold Phase 3 after week 12 pending reassessment — no automatic restart.
  return w <= 4 ? 1 : w <= 8 ? 2 : 3;
}

/* ------------------------------------------------------------------ */
/*  PROGRESSION NUDGE ENGINE                                           */
/*  branch mode: rep-range double progression (8 lifts)                */
/*  streak mode: 3 identical tags in a row (swing + standing-flag)     */
/* ------------------------------------------------------------------ */

function computeNudge(ex, hist) {
  if (!ex.id || !hist || hist.length === 0) return null;
  const h = hist; // sorted newest first
  const last = h[0];
  if (ex.mode === "branch" && ex.rr) {
    const lo = ex.rr[0], hi = ex.rr[1];
    if (last.t === "easy") {
      const maxedTwice = h.length >= 2 && h[0].r != null && h[1].r != null && h[0].r >= hi && h[1].r >= hi && h[0].t === "easy" && h[1].t === "easy";
      if (maxedTwice) return { kind: "up", text: ex.accom };
      if (last.r == null) return { kind: "up", text: "Tagged easy — log reps on your limiting set so progression can be judged against the " + lo + "-" + hi + " range." };
      if (last.r < hi) return { kind: "up", text: "Add 1-2 reps next session (top of range is " + hi + ")." };
      return { kind: "up", text: "Top of range hit — one more easy session at " + hi + " reps triggers the accommodation step." };
    }
    if (last.t === "hard") {
      const bottomTwice = h.length >= 2 && h[0].r != null && h[1].r != null && h[0].r <= lo && h[1].r <= lo && h[0].t === "hard" && h[1].t === "hard";
      if (bottomTwice) return { kind: "down", text: ex.regress };
      if (last.r == null) return { kind: "down", text: "Tagged hard — log reps; if above " + lo + ", reduce reps within the range before touching load." };
      if (last.r > lo) return { kind: "down", text: "Drop reps toward the bottom of range (" + lo + ") next session before changing anything else." };
      return { kind: "down", text: "Bottom of range — one more hard session triggers the regression step." };
    }
    return null;
  }
  // streak mode
  if (h.length >= 3 && h[0].t === h[1].t && h[1].t === h[2].t && h[0].t) {
    if (h[0].t === "easy") return { kind: "up", text: "Tagged too easy 3x running — " + (ex.accom || "progress via tempo or an extra set.") };
    if (h[0].t === "hard") return {
      kind: "down",
      text: ex.standing
        ? "Tagged too hard 3x running — this lift is under-loaded on paper, so the pattern usually signals recovery (sleep / heart rate variability), not load. Check recovery before regressing."
        : (ex.regress || "Reduce a set next session."),
    };
  }
  return null;
}

async function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Migration 5 Jul 2026: protocol restarted, week 1 = Mon 6 Jul 2026
      if (parsed.settings && parsed.settings.anchorDate === "2026-06-22") {
        parsed.settings.anchorDate = "2026-07-06";
        parsed.settings.anchorConfirmed = true;
      }
      return { ...DEFAULT_DATA, ...parsed, settings: { ...DEFAULT_DATA.settings, ...(parsed.settings || {}) } };
    }
  } catch (e) {
    /* key missing on first run — fine */
  }
  return DEFAULT_DATA;
}

async function saveData(data) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error("Save failed", e);
    return false;
  }
}

/*  PHOTOS — IndexedDB (localStorage is too small for images)          */
/* ------------------------------------------------------------------ */

function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("court-board-photos", 1);
    req.onupgradeneeded = () => {
      const store = req.result.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
      store.createIndex("date", "date");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function addPhotoToDB(date, dataUrl) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("photos", "readwrite");
    tx.objectStore("photos").add({ date, dataUrl });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getPhotosForDate(date) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction("photos").objectStore("photos").index("date").getAll(date);
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function deletePhotoFromDB(id) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("photos", "readwrite");
    tx.objectStore("photos").delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1200;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ------------------------------------------------------------------ */

function WeightChart({ weights }) {
  if (weights.length < 2)
    return (
      <div style={{ color: T.muted, fontSize: 14, padding: "12px 0" }}>
        Log at least two entries to see the trend.
      </div>
    );
  const sorted = [...weights].sort((a, b) => a.date.localeCompare(b.date));
  const kgs = sorted.map((w) => w.kg);
  const min = Math.min(...kgs) - 0.5;
  const max = Math.max(...kgs) + 0.5;
  const W = 320, H = 120, pad = 8;
  const pts = sorted.map((w, i) => {
    const x = pad + (i / (sorted.length - 1)) * (W - 2 * pad);
    const y = H - pad - ((w.kg - min) / (max - min)) * (H - 2 * pad);
    return { x, y, ...w };
  });
  const path = pts.map((p, i) => (i === 0 ? `M${p.x},${p.y}` : `L${p.x},${p.y}`)).join(" ");
  // 82-84 target band
  const bandTop = H - pad - ((84 - min) / (max - min)) * (H - 2 * pad);
  const bandBot = H - pad - ((82 - min) / (max - min)) * (H - 2 * pad);
  const showBand = 84 > min && 82 < max;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto" }}>
      {showBand && (
        <rect
          x={pad} width={W - 2 * pad}
          y={Math.max(pad, bandTop)}
          height={Math.max(0, Math.min(H - pad, bandBot) - Math.max(pad, bandTop))}
          fill="rgba(217,230,74,0.07)"
        />
      )}
      <path d={path} fill="none" stroke={T.optic} strokeWidth="2" />
      {pts.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={T.optic} />
      ))}
      <text x={pad} y={12} fill={T.muted} fontSize="10">{max.toFixed(1)} kg</text>
      <text x={pad} y={H - 2} fill={T.muted} fontSize="10">{min.toFixed(1)} kg</text>
    </svg>
  );
}

function TrainingTracker() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("today");
  const [notes, setNotes] = useState("");
  const [weightInput, setWeightInput] = useState("");
  const [saveState, setSaveState] = useState("");
  const [planOpen, setPlanOpen] = useState(null);
  const [viewDateStr, setViewDateStr] = useState(dayKey(new Date()));
  const [photos, setPhotos] = useState([]);
  const [editKey, setEditKey] = useState(null);
  const [editRows, setEditRows] = useState([]);

  const viewDate = new Date(viewDateStr + "T12:00:00");
  const tKey = viewDateStr;
  const isToday = viewDateStr === dayKey(new Date());
  const shiftDay = (n) => {
    const d = new Date(viewDateStr + "T12:00:00");
    d.setDate(d.getDate() + n);
    setViewDateStr(dayKey(d));
  };

  useEffect(() => {
    loadData().then(setData);
  }, []);

  useEffect(() => {
    if (!data) return;
    const s = data.sessions[viewDateStr];
    setNotes(s && s.notes ? s.notes : "");
    getPhotosForDate(viewDateStr).then(setPhotos).catch(() => setPhotos([]));
  }, [!!data, viewDateStr]);

  const persist = async (next) => {
    setData(next);
    setSaveState("saving");
    const ok = await saveData(next);
    setSaveState(ok ? "saved" : "error");
    setTimeout(() => setSaveState(""), 1500);
  };

  const PROG = useMemo(() => {
    const p = JSON.parse(JSON.stringify(PROGRAMME));
    const weekNumForCore = data ? weekNumber(viewDate, data.settings.anchorDate) : 1;
    const phase = coreCyclePhase(weekNumForCore);
    const structural = CORE_STRUCTURAL[phase];
    const tennisCore = CORE_TENNIS[phase];
    const fillCore = (arr, label, block) => {
      const idx = arr.findIndex((e) => e.n.startsWith("Core Block") || e.n.startsWith("Tennis Functional Core"));
      if (idx !== -1) {
        arr[idx] = { ...arr[idx], n: arr[idx].n.replace(/\(see below\)|— see below/i, "").trim() + " — " + block.label, c: block.text };
      }
    };
    if (p.pull) fillCore(p.pull.exercises, "structural", structural);
    if (p.push) fillCore(p.push.exercises, "structural", structural);
    if (p.legs) fillCore(p.legs.exercises, "tennis", tennisCore);
    // Asymmetry taper (anchor 6 Jul 2026): weeks 1-10 = Left 3 / Right 2, weeks 11-12 = 1:1, hold 1:1 after 12 pending re-test
    if (weekNumForCore >= 11) {
      const label = weekNumForCore <= 12 ? "3 sets each side (1:1 taper, wks 11-12)" : "3 sets each side (1:1 hold — asymmetry re-test due)";
      Object.keys(p).forEach((k) => {
        (p[k].exercises || []).forEach((e) => {
          if (e.d && e.d.indexOf("Left 3 sets, right 2 sets") !== -1) {
            e.d = e.d.replace("Left 3 sets, right 2 sets", label);
          }
        });
      });
    }
    if (data && data.overrides) {
      Object.keys(data.overrides).forEach((k) => {
        if (p[k]) p[k].exercises = data.overrides[k];
      });
    }
    return p;
  }, [data, viewDateStr]);

  const derived = useMemo(() => {
    if (!data) return null;
    const weekNum = weekNumber(viewDate, data.settings.anchorDate);
    const cycleWeek = ((((weekNum - 1) % 8) + 8) % 8) + 1;
    // tennis count in the viewed week
    const mon = mondayOf(viewDate);
    let tennisCount = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      const s = data.sessions[dayKey(d)];
      if (s && s.done && s.done.includes("tennis")) tennisCount++;
    }
    const plan = sessionsForDay(viewDate.getDay(), weekNum, tennisCount);
    return { weekNum, cycleWeek, tennisCount, plan };
  }, [data, viewDateStr]);

  if (!data || !derived)
    return (
      <div style={{ background: T.bg, minHeight: "100vh", color: T.muted, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Inter, sans-serif" }}>
        Loading…
      </div>
    );

  const todayLog = data.sessions[tKey] || { done: [], notes: "" };

  // Backup nudge: 14 days since last export from this tracker (or never)
  const backupDays = data.settings.lastExport
    ? Math.floor((Date.now() - data.settings.lastExport) / (24 * 3600 * 1000))
    : null;
  const backupOverdue = backupDays === null || backupDays >= 14;

  const toggleDone = (key) => {
    const done = todayLog.done.includes(key)
      ? todayLog.done.filter((k) => k !== key)
      : [...todayLog.done, key];
    persist({
      ...data,
      sessions: { ...data.sessions, [tKey]: { ...todayLog, done, notes } },
    });
  };

  const saveNotes = () => {
    persist({
      ...data,
      sessions: { ...data.sessions, [tKey]: { ...todayLog, notes } },
    });
  };

  const addWeight = () => {
    const kg = parseFloat(weightInput);
    if (!kg || kg < 40 || kg > 150) return;
    const weights = [...data.weights.filter((w) => w.date !== tKey), { date: tKey, kg }];
    persist({ ...data, weights });
    setWeightInput("");
  };

  const setAnchor = (val) => {
    persist({ ...data, settings: { ...data.settings, anchorDate: val, anchorConfirmed: true } });
  };

  const handlePhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const dataUrl = await compressImage(file);
      await addPhotoToDB(viewDateStr, dataUrl);
      setPhotos(await getPhotosForDate(viewDateStr));
    } catch (err) {
      console.error("Photo failed", err);
    }
  };

  const removePhoto = async (id) => {
    await deletePhotoFromDB(id);
    setPhotos(await getPhotosForDate(viewDateStr));
  };

  const startEdit = (key) => {
    setEditKey(key);
    setEditRows(PROG[key].exercises.map((e) => ({ ...e })));
    setPlanOpen(key);
  };

  const saveEdit = () => {
    persist({ ...data, overrides: { ...(data.overrides || {}), [editKey]: editRows } });
    setEditKey(null);
  };

  const resetEdit = (key) => {
    const overrides = { ...(data.overrides || {}) };
    delete overrides[key];
    persist({ ...data, overrides });
    setEditKey(null);
  };

  const exportData = () => {
    const stamped = { ...data, settings: { ...data.settings, lastExport: Date.now() } };
    const blob = new Blob([JSON.stringify(stamped, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "court-board-" + dayKey(new Date()) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    persist(stamped);
  };

  const importData = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== "object" || !parsed.sessions) throw new Error("bad format");
        persist({ ...DEFAULT_DATA, ...parsed, settings: { ...DEFAULT_DATA.settings, ...(parsed.settings || {}) } });
      } catch (err) {
        setSaveState("error");
        setTimeout(() => setSaveState(""), 1500);
      }
    };
    reader.readAsText(file);
  };

  const inp = { width: "100%", background: T.cardAlt, border: `1px solid ${T.line}`, borderRadius: 6, padding: "8px 10px", color: T.chalk, fontSize: 14, outline: "none", marginBottom: 6, boxSizing: "border-box", fontFamily: "'Inter', sans-serif" };

  const exHist = (exId) => ((data.exlog || {})[exId] || []);
  const todayEntry = (exId) => exHist(exId).find((en) => en.d === tKey) || null;

  const logEx = (exId, patch) => {
    const exlog = { ...(data.exlog || {}) };
    const arr = [...(exlog[exId] || [])];
    const idx = arr.findIndex((en) => en.d === tKey);
    if (idx >= 0) arr[idx] = { ...arr[idx], ...patch };
    else arr.push({ d: tKey, ...patch });
    arr.sort((a, b) => b.d.localeCompare(a.d));
    exlog[exId] = arr;
    persist({ ...data, exlog });
  };

  const EFFORT_TAGS = [["easy", "Too easy"], ["right", "Right"], ["hard", "Too hard"]];

  const renderTracking = (e) => {
    if (!e.id) return null;
    const entry = todayEntry(e.id);
    const hist = exHist(e.id);
    const nudge = computeNudge(e, hist);
    return (
      <div style={{ marginTop: 8 }}>
        {e.standing && (
          <div style={{ fontSize: 12, color: T.optic, border: `1px solid ${T.line}`, borderRadius: 6, padding: "6px 8px", marginBottom: 8, lineHeight: 1.5 }}>
            ⚑ {e.standing}
          </div>
        )}
        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
          {EFFORT_TAGS.map(([val, label]) => {
            const selected = entry && entry.t === val;
            return (
              <button
                key={val}
                onClick={() => logEx(e.id, { t: selected ? null : val })}
                style={{ fontFamily: "'Oswald', sans-serif", fontSize: 11, letterSpacing: "0.05em", textTransform: "uppercase", padding: "5px 9px", borderRadius: 5, cursor: "pointer", border: `1px solid ${selected ? T.optic : T.line}`, background: selected ? "rgba(217,230,74,0.12)" : "transparent", color: selected ? T.optic : T.muted }}
              >
                {label}
              </button>
            );
          })}
          {e.rr && (
            <input
              key={e.id + tKey}
              type="number"
              inputMode="numeric"
              placeholder="reps"
              defaultValue={entry && entry.r != null ? entry.r : ""}
              onBlur={(ev) => { const v = parseInt(ev.target.value, 10); logEx(e.id, { r: isNaN(v) ? null : v }); }}
              style={{ width: 64, background: T.cardAlt, border: `1px solid ${T.line}`, borderRadius: 5, padding: "5px 8px", color: T.chalk, fontSize: 13, outline: "none" }}
            />
          )}
          {hist.length > 0 && (
            <span title="Last 5 sessions, newest first" style={{ fontSize: 11, color: T.muted, letterSpacing: "0.2em" }}>
              {hist.slice(0, 5).map((en) => (en.t === "easy" ? "E" : en.t === "hard" ? "H" : en.t === "right" ? "R" : "·")).join(" ")}
            </span>
          )}
        </div>
        {e.rr && (
          <div style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>
            Range {e.rr[0]}-{e.rr[1]} reps — log reps on your limiting set
          </div>
        )}
        {nudge && (
          <div style={{ fontSize: 12, color: nudge.kind === "down" ? T.danger : T.optic, marginTop: 6, lineHeight: 1.5 }}>
            → {nudge.text}
          </div>
        )}
      </div>
    );
  };

  const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const hiitLabel = derived.cycleWeek === 8 ? "Deload week" : "Norwegian 4×4 (2x this week)";
  const corePhase = coreCyclePhase(derived.weekNum);
  const corePhaseLabel = derived.weekNum > 12
    ? "Core: Phase 3 (hold — re-test due)"
    : corePhase === 1 ? "Core: Phase 1 (motor control)" : corePhase === 2 ? "Core: Phase 2 (anti-rotation load)" : "Core: Phase 3 (rotational power)";
  const ratioLabel = derived.weekNum >= 11 ? (derived.weekNum <= 12 ? "Ratio: 1:1 taper" : "Ratio: 1:1 hold") : "Ratio: Left 3 / Right 2";

  const TABS = [
    ["today", "Today"],
    ["plan", "Plan"],
    ["weight", "Weight"],
    ["history", "Log"],
    ["settings", "Set-up"],
  ];

  return (
    <div style={{ background: T.bg, minHeight: "100vh", color: T.chalk, fontFamily: "'Inter', sans-serif" }}>
      <style>{FONT_LINK}</style>
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 90px" }}>

        {/* Scoreboard header */}
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", borderBottom: `2px solid ${T.optic}`, paddingBottom: 10 }}>
          <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 26, letterSpacing: "0.04em", textTransform: "uppercase" }}>
            Court Board
          </div>
          <div style={{ fontFamily: "'Oswald', sans-serif", color: T.muted, fontSize: 14, letterSpacing: "0.08em" }}>
            Week {derived.weekNum} · Cycle {derived.cycleWeek}/8
          </div>
        </div>

        {saveState && (
          <div style={{ fontSize: 12, color: saveState === "error" ? T.danger : T.optic, marginTop: 6 }}>
            {saveState === "saving" ? "Saving…" : saveState === "saved" ? "Saved" : "Save failed — retry"}
          </div>
        )}

        {backupOverdue && (
          <div style={{ fontSize: 12, color: T.danger, border: `1px solid ${T.danger}`, background: "rgba(224,122,95,0.10)", borderRadius: 6, padding: "8px 10px", marginTop: 10, lineHeight: 1.5 }}>
            {backupDays === null
              ? "No backup has ever been exported from this tracker. Data lives in this browser only — Export JSON in Set-up, or Export All on the dashboard."
              : "Backup overdue: last export was " + backupDays + " days ago. Export JSON in Set-up, or Export All on the dashboard."}
          </div>
        )}

        {!data.settings.anchorConfirmed && (
          <Card style={{ marginTop: 14, borderColor: T.optic }}>
            <div style={{ fontSize: 13, color: T.chalk }}>
              Week counting is anchored to <b>{data.settings.anchorDate}</b> (unconfirmed).

            </div>
          </Card>

              <input
                type="date"
                value={viewDateStr}
                onChange={(e) => e.target.value && setViewDateStr(e.target.value)}
                style={{ flex: 1, background: T.cardAlt, border: `1px solid ${T.line}`, borderRadius: 6, padding: "8px 10px", color: T.chalk, fontSize: 14, outline: "none" }}
              />
              <Btn small onClick={() => shiftDay(1)}>▶</Btn>
              {!isToday && (
                <Btn small primary onClick={() => setViewDateStr(dayKey(new Date()))}>Today</Btn>
              )}
            </div>
            <SectionLabel>
              {dayNames[viewDate.getDay()]} · {tKey}{isToday ? "" : " — viewing another day"}
            </SectionLabel>

            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
              <Chip active>{hiitLabel}</Chip>
              <Chip active>{corePhaseLabel}</Chip>
              <Chip active>{ratioLabel}</Chip>
              <Chip active={derived.tennisCount >= 2}>
                Tennis {derived.tennisCount}/2
              </Chip>

            {derived.plan.note && (

                {derived.plan.note}
              </div>

            {(() => {

              return (
                <Card style={{ marginBottom: 12, borderColor: primerDone ? T.optic : T.line }}>

                      {s.name}
                    </div>
                    <Btn small primary={!primerDone} onClick={() => toggleDone("primer")}>
                      {primerDone ? "Done ✓" : "Mark done"}
                    </Btn>
                  </div>

                    <div key={i} style={{ padding: "8px 0", borderTop: `1px solid ${T.line}` }}>

                return (

                    key={k}
                    onClick={() => toggleDone(k)}
                    style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 0", borderTop: i ? `1px solid ${T.line}` : "none", cursor: "pointer" }}
                  >
                    <div style={{ width: 18, height: 18, borderRadius: 4, border: `1.5px solid ${isDone ? T.optic : T.muted}`, background: isDone ? T.optic : "transparent", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "#141810", fontSize: 12, fontWeight: 700 }}>
                      {isDone ? "✓" : ""}
                    </div>
                    <div style={{ fontSize: 14, color: isDone ? T.muted : T.chalk, textDecoration: isDone ? "line-through" : "none" }}>
                      {a}
                    </div>
                  </div>
                );
              })}
            </Card>

            <SectionLabel>Session notes</SectionLabel>
            <Card>
              <textarea
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                placeholder="How it went, swaps made, anything for Sunday review…"
                rows={3}
                style={{ width: "100%", background: "transparent", border: "none", outline: "none", color: T.chalk, fontFamily: "'Inter', sans-serif", fontSize: 14, resize: "vertical" }}
              />
              <Btn small onClick={saveNotes} style={{ marginTop: 8 }}>Save notes</Btn>
            </Card>

            <SectionLabel>Photos</SectionLabel>
            <Card>
              <label style={{ display: "inline-block" }}>
                <span style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 13, letterSpacing: "0.06em", textTransform: "uppercase", padding: "8px 14px", borderRadius: 6, cursor: "pointer", background: T.optic, color: "#141810", display: "inline-block" }}>
                  Add photo
                </span>
                <input type="file" accept="image/*" onChange={handlePhoto} style={{ display: "none" }} />
              </label>
              {photos.length === 0 && (
                <div style={{ color: T.muted, fontSize: 13, marginTop: 10 }}>No photos for this day.</div>
              )}
              {photos.length > 0 && (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginTop: 12 }}>
                  {photos.map((p) => (
                    <div key={p.id} style={{ position: "relative" }}>
                      <img src={p.dataUrl} alt="" style={{ width: "100%", borderRadius: 6, display: "block" }} />
                      <button
                        onClick={() => removePhoto(p.id)}
                        style={{ position: "absolute", top: 4, right: 4, background: "rgba(0,0,0,0.65)", color: T.chalk, border: "none", borderRadius: 4, cursor: "pointer", fontSize: 12, padding: "2px 7px" }}
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <div style={{ fontSize: 11, color: T.muted, marginTop: 10 }}>
                Photos are compressed and stored in this browser only.
              </div>
            </Card>
          </>
        )}

        {/* ---------------- PLAN ---------------- */}
        {tab === "plan" && (
          <>
            <SectionLabel>Weekly skeleton</SectionLabel>
            <Card>
              {[
                ["Mon", "Pull + Core A (structural)"],
                ["Tue", "Norwegian 4×4 (1st of 2)"],
                ["Wed", "Legs · Power + Tennis Core + Tennis 8pm"],
                ["Thu", "Push + Core B (structural)"],
                ["Fri", "Norwegian 4×4 (2nd of 2)"],
                ["Sat", "Tennis OR Long Zone 2 (75-90 min) — cap 2 tennis/week"],
                ["Sun", "Rest + meal prep. Notion review. No training."],
              ].map(([d, s], i) => (
                <div key={d} style={{ display: "flex", gap: 14, padding: "8px 0", borderTop: i ? `1px solid ${T.line}` : "none" }}>
                  <div style={{ fontFamily: "'Oswald', sans-serif", width: 70, color: T.optic, fontWeight: 600, fontSize: 14, textTransform: "uppercase" }}>{d}</div>
                  <div style={{ fontSize: 14 }}>{s}</div>
                </div>
              ))}
            </Card>

            <SectionLabel>Prescriptions</SectionLabel>
            <Card>
              <div style={{ fontSize: 14, lineHeight: 1.7 }}>
                Zone 2: heart rate 120-130 (measured). High-intensity intervals: heart rate 157-165 (90-95% of maximum heart rate 174).
                Power cue: 3-second lowering, explosive lift, every exercise.
                Left side always leads; left exercises first when fresh, 3:2 set ratio.
                Tennis cap: 2/week (Wednesday evening + one weekend day) until heart rate variability stabilises above 55.
              </div>
            </Card>

            <SectionLabel>Equipment</SectionLabel>
            <Card>
              <div style={{ fontSize: 14, lineHeight: 1.7 }}>
                2× 15 kg dumbbells (primary compound-lift tool) · 2× 16 kg kettlebells (swings, front squats, windmills, single-arm work) ·
                Technogym bench with integrated 10 kg dumbbells (small-muscle/rehab only — lateral raises, rear delts, rotator cuff) ·
                Pull-up bar · resistance bands. No cable machine, barbell, or rack.
                Flag: 15 kg dumbbells and 16 kg kettlebells are likely to be outgrown for hinge/squat strength within 4-8 weeks —
                next purchase is a heavier adjustable pair or a single heavier kettlebell (24 kg+).
              </div>
            </Card>

            <SectionLabel>Heart rate variability downgrade rules</SectionLabel>
            <Card>
              <div style={{ fontSize: 13, lineHeight: 1.7, color: T.muted }}>
                Trigger: 7-day heart rate variability below 43 milliseconds, or waking Body Battery below 35.<br/>
                <b style={{ color: T.chalk }}>Norwegian 4×4</b> → Zone 2 only, 30-40 min.<br/>
                <b style={{ color: T.chalk }}>Pull / Push</b> → 2 sets, ~60% load. If Body Battery &lt;25: mobility + Core Block only.<br/>
                <b style={{ color: T.chalk }}>Wednesday Legs/Power</b> → skip plyometrics, reduce hinge to technique sets, keep core + Zone 2.<br/>
                <b style={{ color: T.chalk }}>Core &amp; Daily Primer</b> → never downgrade, always restorative.<br/>
                <b style={{ color: T.chalk }}>Long Zone 2</b> → reduce to 45-60 min, low end of zone.<br/>
                <b style={{ color: T.chalk }}>Tennis</b> → social rally, not competitive points.<br/>
                Never more than 2 consecutive high-intensity days or 2 consecutive rest days. Heart rate variability suppressed 3+ days → 3-5 day deload, prioritise sleep.
              </div>
            </Card>

            <SectionLabel>Session detail</SectionLabel>
            {["primer", "pull", "legs", "push", "hiit44", "deload", "tennis", "longz2"].map((key) => {
              const s = PROG[key];
              const open = planOpen === key;
              const hasOverride = data.overrides && data.overrides[key];
              return (
                <Card key={key} style={{ marginBottom: 10 }}>
                  <div onClick={() => setPlanOpen(open ? null : key)} style={{ display: "flex", justifyContent: "space-between", cursor: "pointer" }}>
                    <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 16, textTransform: "uppercase", letterSpacing: "0.04em" }}>
                      {s.name}{hasOverride ? " •" : ""}
                    </div>
                    <div style={{ color: T.muted }}>{open ? "−" : "+"}</div>
                  </div>
                  {open && editKey !== key && (
                    <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                      <Btn small onClick={() => startEdit(key)}>Edit</Btn>
                      {hasOverride && <Btn small onClick={() => resetEdit(key)}>Reset to default</Btn>}
                    </div>
                  )}
                  {open && editKey === key && (
                    <div style={{ marginTop: 10 }}>
                      {editRows.map((row, i) => (
                        <div key={i} style={{ borderTop: `1px solid ${T.line}`, padding: "10px 0" }}>
                          <div style={{ fontSize: 11, color: T.muted, marginBottom: 4 }}>Identifier: {row.id || "(none — no tag tracking)"}</div>
                          <input
                            value={row.n}
                            onChange={(ev) => { const r = [...editRows]; r[i] = { ...r[i], n: ev.target.value }; setEditRows(r); }}
                            placeholder="Exercise name"
                            style={inp}
                          />
                          <input
                            value={row.d}
                            onChange={(ev) => { const r = [...editRows]; r[i] = { ...r[i], d: ev.target.value }; setEditRows(r); }}
                            placeholder="Sets / reps / load"
                            style={inp}
                          />
                          <textarea
                            value={row.c || ""}
                            onChange={(ev) => { const r = [...editRows]; r[i] = { ...r[i], c: ev.target.value }; setEditRows(r); }}
                            placeholder="Form cues / instructions"
                            rows={2}
                            style={{ ...inp, resize: "vertical" }}
                          />
                          <Btn small onClick={() => setEditRows(editRows.filter((_, j) => j !== i))}>Remove</Btn>
                        </div>
                      ))}
                      <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                        <Btn small onClick={() => setEditRows([...editRows, { id: "custom-" + Date.now(), n: "", d: "", c: "", v: yt("exercise form") }])}>+ Add exercise</Btn>
                        <Btn small primary onClick={saveEdit}>Save</Btn>
                        <Btn small onClick={() => setEditKey(null)}>Cancel</Btn>
                      </div>
                    </div>
                  )}
                  {open && editKey !== key &&
                    s.exercises.map((e, i) => (
                      <div key={i} style={{ padding: "8px 0", borderTop: `1px solid ${T.line}`, marginTop: i === 0 ? 10 : 0 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 14, fontWeight: 600 }}>{e.n}</div>
                            <div style={{ fontSize: 13, color: T.muted }}>{e.d}</div>
                            {e.c && <div style={{ fontSize: 12.5, color: T.muted, marginTop: 5, lineHeight: 1.5 }}>{e.c}</div>}
                          </div>
                          <div style={{ display: "flex", flexDirection: "column", gap: 5, alignSelf: "flex-start" }}><a href={e.v} target="_blank" rel="noreferrer" style={{ color: T.opticDim, fontSize: 12, textDecoration: "none", whiteSpace: "nowrap" }}>▶ form</a><a href={imgLink(e.v)} target="_blank" rel="noreferrer" style={{ color: T.opticDim, fontSize: 12, textDecoration: "none", whiteSpace: "nowrap" }}>▣ pics</a></div>
                        </div>
                      </div>
                    ))}
                </Card>
              );
            })}
          </>
        )}

        {/* ---------------- WEIGHT ---------------- */}
        {tab === "weight" && (
          <>
            <SectionLabel>Weekly weigh-in</SectionLabel>
            <Card>
              <div style={{ display: "flex", gap: 10 }}>
                <input
                  value={weightInput}
                  onChange={(e) => setWeightInput(e.target.value)}
                  placeholder="kg"
                  inputMode="decimal"
                  style={{ flex: 1, background: T.cardAlt, border: `1px solid ${T.line}`, borderRadius: 6, padding: "10px 12px", color: T.chalk, fontSize: 16, outline: "none" }}
                />
                <Btn primary onClick={addWeight}>Log</Btn>
              </div>
              <div style={{ fontSize: 12, color: T.muted, marginTop: 8 }}>
                Target band 82-84 kg (August retest) shown on the chart.
              </div>
            </Card>

            <SectionLabel>Trend</SectionLabel>
            <Card>
              <WeightChart weights={data.weights} />
            </Card>

            {data.weights.length > 0 && (
              <>
                <SectionLabel>Entries</SectionLabel>
                <Card>
                  {[...data.weights]
                    .sort((a, b) => b.date.localeCompare(a.date))
                    .map((w, i) => (
                      <div key={w.date} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderTop: i ? `1px solid ${T.line}` : "none", fontSize: 14 }}>
                        <span style={{ color: T.muted }}>{w.date}</span>
                        <span>{w.kg.toFixed(1)} kg</span>
                      </div>
                    ))}
                </Card>
              </>
            )}
          </>
        )}

        {/* ---------------- HISTORY ---------------- */}
        {tab === "history" && (
          <>
            <SectionLabel>Session log</SectionLabel>
            {Object.keys(data.sessions).length === 0 && (
              <div style={{ color: T.muted, fontSize: 14 }}>Nothing logged yet.</div>
            )}
            {Object.entries(data.sessions)
              .sort((a, b) => b[0].localeCompare(a[0]))
              .slice(0, 30)
              .map(([date, s]) => (
                <Card key={date} style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 15 }}>{date}</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {s.done.filter((d) => !d.startsWith("acc")).map((d) => (
                        <Chip key={d} active>{PROG[d] ? PROG[d].name : d}</Chip>
                      ))}
                    </div>
                  </div>
                  {s.notes && <div style={{ fontSize: 13, color: T.muted }}>{s.notes}</div>}
                </Card>
              ))}
          </>
        )}

        {/* ---------------- SETTINGS ---------------- */}
        {tab === "settings" && (
          <>
            <SectionLabel>Week 1 anchor (Monday)</SectionLabel>
            <Card>
              <div style={{ fontSize: 13, color: T.muted, marginBottom: 10, lineHeight: 1.5 }}>
                Drives the week counter for the core phases, the asymmetry taper, and the
                week-8 deload of each 8-week cycle. Set it to the Monday your current cycle started.
              </div>
              <input
                type="date"
                defaultValue={data.settings.anchorDate}
                onChange={(e) => e.target.value && setAnchor(e.target.value)}
                style={{ background: T.cardAlt, border: `1px solid ${T.line}`, borderRadius: 6, padding: "10px 12px", color: T.chalk, fontSize: 15, outline: "none", width: "100%" }}
              />
              <div style={{ fontSize: 13, marginTop: 10, color: data.settings.anchorConfirmed ? T.optic : T.danger }}>
                {data.settings.anchorConfirmed ? "Confirmed — week 1 = " + data.settings.anchorDate : "Unconfirmed default (6 Jul 2026)"}
              </div>
            </Card>

            <SectionLabel>Data</SectionLabel>
            <Card>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <Btn small primary onClick={exportData}>Export JSON</Btn>
                <label style={{ display: "inline-block" }}>
                  <span style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 13, letterSpacing: "0.06em", textTransform: "uppercase", padding: "8px 14px", borderRadius: 6, cursor: "pointer", border: `1px solid ${T.line}`, color: T.chalk, display: "inline-block" }}>
                    Import JSON
                  </span>
                  <input type="file" accept="application/json,.json" onChange={importData} style={{ display: "none" }} />
                </label>
              </div>
              <div style={{ fontSize: 12, color: T.muted, marginTop: 10, lineHeight: 1.5 }}>
                Export downloads sessions, weights, settings and programme edits as a
                JSON file (photos not included). Import replaces this device's data
                with the file's contents. Use the pair to move data between phone and
                laptop, or share the exported file with Claude for analysis. A reminder
                appears on the Today tab if no export has run in 14 days. The dashboard's
                Export All also covers this tracker's data.
              </div>
            </Card>

            <SectionLabel>About</SectionLabel>
            <Card>
              <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.6 }}>
                Protocol per Master Context Briefing §14.6 as updated 5 July 2026 (integrates 28 June research;
                week 1 of all cycles anchors Monday 6 July 2026). Rep ranges completed across all lifts
                18 July 2026. Sunday is rest + meal prep.
                Tennis: Wednesday 8pm and Saturday only, cap 2/week.
                Effort tags and rep logging on the tracked lifts drive progression nudges — informational
                only; load changes are yours, made via Edit on the Plan tab (edited sessions show a • mark;
                exercise identifiers survive edits so tag history is never lost).
                Navigate to any date on the Today tab to view, log, or backfill.
                Raw training data lives here; Sunday reflective review stays in Notion.
                Data and photos are stored in this browser only — they will not sync
                between your phone and laptop. Use Export/Import above to move data.
              </div>
            </Card>
          </>
        )}
      </div>

      {/* Bottom tab bar */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: T.card, borderTop: `1px solid ${T.line}` }}>
        <div style={{ maxWidth: 480, margin: "0 auto", display: "flex" }}>
          {TABS.map(([k, label]) => (
            <button
              key={k}
              onClick={() => setTab(k)}
              style={{
                flex: 1, padding: "14px 4px", background: "transparent", border: "none", cursor: "pointer",
                fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 12, letterSpacing: "0.08em",
                textTransform: "uppercase",
                color: tab === k ? T.optic : T.muted,
                borderTop: tab === k ? `2px solid ${T.optic}` : "2px solid transparent",
              }}
            >
              {label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TrainingTracker />);
</script>
</body>
</html>
