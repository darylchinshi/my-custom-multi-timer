/* ------------------------------------------------------------------ */
/*  DATE HELPERS                                                       */
/* ------------------------------------------------------------------ */

const dayKey = (d) => {
  const x = new Date(d);
  return (
    x.getFullYear() +
    "-" +
    String(x.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(x.getDate()).padStart(2, "0")
  );
};

const mondayOf = (d) => {
  const x = new Date(d);
  const day = x.getDay(); // 0 Sun
  const diff = day === 0 ? -6 : 1 - day;
  x.setDate(x.getDate() + diff);
  x.setHours(0, 0, 0, 0);
  return x;
};

const weekNumber = (today, anchorStr) => {
  const anchor = mondayOf(new Date(anchorStr + "T00:00:00"));
  const thisMon = mondayOf(today);
  const diff = Math.round((thisMon - anchor) / (7 * 24 * 3600 * 1000));
  return diff + 1; // week 1 = anchor week
};

/* ------------------------------------------------------------------ */
/*  DAILY LOGIC                                                        */
/* ------------------------------------------------------------------ */

function sessionsForDay(dow, weekNum, tennisCount) {
  // HIIT parity: odd weeks 4x4, even 10-20-30; week 8 of 8-week cycle = deload
  const cycleWeek = ((((weekNum - 1) % 8) + 8) % 8) + 1;
  const hiitKey = cycleWeek === 8 ? "deload" : weekNum % 2 === 1 ? "hiit44" : "hiit1020";

  switch (dow) {
    case 1: return { main: ["pull"], note: null };
    case 2: return { main: [hiitKey], note: "Dedicated HIIT slot (Wed tennis is the second HIIT of the week)." };
    case 3: return { main: ["legs", "tennis"], note: "Tennis 8pm. Fast wind-down after: home ~22:00, lights out 22:30." };
    case 4: return { main: ["yoga"], note: "Weekly yoga/Pilates slot. Swap freely if the week demands." };
    case 5: return { main: ["push"], note: null };
    case 6:
    case 0:
      if (tennisCount >= 2)
        return { main: ["longz2"], note: "Tennis cap (2/week) reached. Long Zone 2 or full rest." };
      return {
        main: ["tennis", "longz2"],
        note: "Choose one: tennis morning (counts toward 2/week cap) OR long Zone 2 75-90 min.",
        choice: true,
      };
    default: return { main: ["rest"], note: null };
  }
}

async function loadData() {

    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return { ...DEFAULT_DATA, ...JSON.parse(raw) };
  } catch (e) {
    /* key missing on first run — fine */
  }
  return DEFAULT_DATA;
}

async function saveData(data) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error("Save failed", e);
    return false;
  }
}

/* ------------------------------------------------------------------ */
/*  PHOTOS — IndexedDB (localStorage is too small for images)          */
/* ------------------------------------------------------------------ */

function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("court-board-photos", 1);
    req.onupgradeneeded = () => {
      const store = req.result.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
      store.createIndex("date", "date");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function addPhotoToDB(date, dataUrl) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("photos", "readwrite");
    tx.objectStore("photos").add({ date, dataUrl });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getPhotosForDate(date) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction("photos").objectStore("photos").index("date").getAll(date);
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function deletePhotoFromDB(id) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("photos", "readwrite");
    tx.objectStore("photos").delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1200;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/*  WEIGHT CHART (inline SVG)                                          */
/* ------------------------------------------------------------------ */

function WeightChart({ weights }) {
  if (weights.length < 2)
    return (
      <div style={{ color: T.muted, fontSize: 14, padding: "12px 0" }}>
        Log at least two entries to see the trend.
      </div>
    );
  const sorted = [...weights].sort((a, b) => a.date.localeCompare(b.date));
  const kgs = sorted.map((w) => w.kg);
  const min = Math.min(...kgs) - 0.5;
  const max = Math.max(...kgs) + 0.5;
  const W = 320, H = 120, pad = 8;
  const pts = sorted.map((w, i) => {
    const x = pad + (i / (sorted.length - 1)) * (W - 2 * pad);
    const y = H - pad - ((w.kg - min) / (max - min)) * (H - 2 * pad);
    return { x, y, ...w };
  });
  const path = pts.map((p, i) => (i === 0 ? `M${p.x},${p.y}` : `L${p.x},${p.y}`)).join(" ");
  // 82-84 target band
  const bandTop = H - pad - ((84 - min) / (max - min)) * (H - 2 * pad);
  const bandBot = H - pad - ((82 - min) / (max - min)) * (H - 2 * pad);
  const showBand = 84 > min && 82 < max;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto" }}>
      {showBand && (
        <rect
          x={pad} width={W - 2 * pad}
          y={Math.max(pad, bandTop)}
          height={Math.max(0, Math.min(H - pad, bandBot) - Math.max(pad, bandTop))}
          fill="rgba(217,230,74,0.07)"
        />
      )}
      <path d={path} fill="none" stroke={T.optic} strokeWidth="2" />
      {pts.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={T.optic} />
      ))}
      <text x={pad} y={12} fill={T.muted} fontSize="10">{max.toFixed(1)} kg</text>
      <text x={pad} y={H - 2} fill={T.muted} fontSize="10">{min.toFixed(1)} kg</text>
    </svg>
  );
}

function TrainingTracker() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("today");
  const [notes, setNotes] = useState("");
  const [weightInput, setWeightInput] = useState("");
  const [saveState, setSaveState] = useState("");
  const [planOpen, setPlanOpen] = useState(null);
  const [viewDateStr, setViewDateStr] = useState(dayKey(new Date()));
  const [photos, setPhotos] = useState([]);
  const [editKey, setEditKey] = useState(null);
  const [editRows, setEditRows] = useState([]);

  const viewDate = new Date(viewDateStr + "T12:00:00");
  const tKey = viewDateStr;
  const isToday = viewDateStr === dayKey(new Date());
  const shiftDay = (n) => {
    const d = new Date(viewDateStr + "T12:00:00");
    d.setDate(d.getDate() + n);
    setViewDateStr(dayKey(d));
  };

  useEffect(() => {
    loadData().then(setData);
  }, []);

  useEffect(() => {
    if (!data) return;
    const s = data.sessions[viewDateStr];
    setNotes(s && s.notes ? s.notes : "");
    getPhotosForDate(viewDateStr).then(setPhotos).catch(() => setPhotos([]));
  }, [!!data, viewDateStr]);

  const persist = async (next) => {
    setData(next);
    setSaveState("saving");
    const ok = await saveData(next);
    setSaveState(ok ? "saved" : "error");
    setTimeout(() => setSaveState(""), 1500);
  };

  const PROG = useMemo(() => {
    const p = JSON.parse(JSON.stringify(PROGRAMME));
    if (data && data.overrides) {
      Object.keys(data.overrides).forEach((k) => {
        if (p[k]) p[k].exercises = data.overrides[k];
      });
    }
    return p;
  }, [data]);

  const derived = useMemo(() => {
    if (!data) return null;
    const weekNum = weekNumber(viewDate, data.settings.anchorDate);
    const cycleWeek = ((((weekNum - 1) % 8) + 8) % 8) + 1;
    // tennis count in the viewed week
    const mon = mondayOf(viewDate);
    let tennisCount = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      const s = data.sessions[dayKey(d)];
      if (s && s.done && s.done.includes("tennis")) tennisCount++;
    }
    const plan = sessionsForDay(viewDate.getDay(), weekNum, tennisCount);
    return { weekNum, cycleWeek, tennisCount, plan };
  }, [data, viewDateStr]);

  if (!data || !derived)
    return (
      <div style={{ background: T.bg, minHeight: "100vh", color: T.muted, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Inter, sans-serif" }}>
        Loading…
      </div>
    );

  const todayLog = data.sessions[tKey] || { done: [], notes: "" };

  const toggleDone = (key) => {
    const done = todayLog.done.includes(key)
      ? todayLog.done.filter((k) => k !== key)
      : [...todayLog.done, key];
    persist({
      ...data,
      sessions: { ...data.sessions, [tKey]: { ...todayLog, done, notes } },
    });
  };

  const saveNotes = () => {
    persist({
      ...data,
      sessions: { ...data.sessions, [tKey]: { ...todayLog, notes } },
    });
  };

  const addWeight = () => {
    const kg = parseFloat(weightInput);
    if (!kg || kg < 40 || kg > 150) return;
    const weights = [...data.weights.filter((w) => w.date !== tKey), { date: tKey, kg }];
    persist({ ...data, weights });
    setWeightInput("");
  };

  const setAnchor = (val) => {
    persist({ ...data, settings: { ...data.settings, anchorDate: val, anchorConfirmed: true } });
  };

  const handlePhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const dataUrl = await compressImage(file);
      await addPhotoToDB(viewDateStr, dataUrl);
      setPhotos(await getPhotosForDate(viewDateStr));
    } catch (err) {
      console.error("Photo failed", err);
    }
  };

  const removePhoto = async (id) => {
    await deletePhotoFromDB(id);
    setPhotos(await getPhotosForDate(viewDateStr));
  };

  const startEdit = (key) => {
    setEditKey(key);
    setEditRows(PROG[key].exercises.map((e) => ({ ...e })));
    setPlanOpen(key);
  };

  const saveEdit = () => {
    persist({ ...data, overrides: { ...(data.overrides || {}), [editKey]: editRows } });
    setEditKey(null);
  };

  const resetEdit = (key) => {
    const overrides = { ...(data.overrides || {}) };
    delete overrides[key];
    persist({ ...data, overrides });
    setEditKey(null);
  };

  const inp = { width: "100%", background: T.cardAlt, border: `1px solid ${T.line}`, borderRadius: 6, padding: "8px 10px", color: T.chalk, fontSize: 14, outline: "none", marginBottom: 6, boxSizing: "border-box", fontFamily: "'Inter', sans-serif" };

  const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const hiitLabel =
    derived.cycleWeek === 8 ? "Deload week" : derived.weekNum % 2 === 1 ? "4×4 week" : "10-20-30 week";

  const TABS = [
    ["today", "Today"],
    ["plan", "Plan"],
    ["weight", "Weight"],
    ["history", "Log"],
    ["settings", "Set-up"],
  ];

  return (
    <div style={{ background: T.bg, minHeight: "100vh", color: T.chalk, fontFamily: "'Inter', sans-serif" }}>
      <style>{FONT_LINK}</style>
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 90px" }}>

        {/* Scoreboard header */}
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", borderBottom: `2px solid ${T.optic}`, paddingBottom: 10 }}>
          <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 26, letterSpacing: "0.04em", textTransform: "uppercase" }}>
            Court Board
          </div>
          <div style={{ fontFamily: "'Oswald', sans-serif", color: T.muted, fontSize: 14, letterSpacing: "0.08em" }}>
            WK {derived.weekNum} · C{derived.cycleWeek}/8
          </div>
        </div>

        {saveState && (
          <div style={{ fontSize: 12, color: saveState === "error" ? T.danger : T.optic, marginTop: 6 }}>
            {saveState === "saving" ? "Saving…" : saveState === "saved" ? "Saved" : "Save failed — retry"}
          </div>
        )}

        {!data.settings.anchorConfirmed && (
          <Card style={{ marginTop: 14, borderColor: T.optic }}>
            <div style={{ fontSize: 13, color: T.chalk }}>
              Week counting is anchored to <b>{data.settings.anchorDate}</b> (unconfirmed).
              Confirm or change it in Set-up — HIIT parity and deload depend on it.
            </div>
          </Card>
        )}

        {/* ---------------- TODAY ---------------- */}
        {tab === "today" && (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 16 }}>
              <Btn small onClick={() => shiftDay(-1)}>◀</Btn>
              <input
                type="date"
                value={viewDateStr}
                onChange={(e) => e.target.value && setViewDateStr(e.target.value)}
                style={{ flex: 1, background: T.cardAlt, border: `1px solid ${T.line}`, borderRadius: 6, padding: "8px 10px", color: T.chalk, fontSize: 14, outline: "none" }}
              />
              <Btn small onClick={() => shiftDay(1)}>▶</Btn>
              {!isToday && (
                <Btn small primary onClick={() => setViewDateStr(dayKey(new Date()))}>Today</Btn>
              )}
            </div>
            <SectionLabel>
              {dayNames[viewDate.getDay()]} · {tKey}{isToday ? "" : " — viewing another day"}
            </SectionLabel>

            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
              <Chip active>{hiitLabel}</Chip>
              <Chip active={derived.tennisCount >= 2}>
                Tennis {derived.tennisCount}/2
              </Chip>
            </div>

            {derived.plan.note && (
              <div style={{ fontSize: 14, color: T.muted, marginBottom: 14, lineHeight: 1.5 }}>
                {derived.plan.note}
              </div>
            )}

            {derived.plan.main.map((key) => {
              const s = PROG[key];
              const isDone = todayLog.done.includes(key);
              return (
                <Card key={key} style={{ marginBottom: 12, borderColor: isDone ? T.optic : T.line }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: s.exercises.length ? 12 : 0 }}>
                    <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 20, textTransform: "uppercase", letterSpacing: "0.04em", color: isDone ? T.optic : T.chalk }}>
                      {s.name}
                    </div>
                    <Btn small primary={!isDone} onClick={() => toggleDone(key)}>
                      {isDone ? "Done ✓" : "Mark done"}
                    </Btn>
                  </div>
                  {s.exercises.map((e, i) => (
                    <div key={i} style={{ padding: "8px 0", borderTop: `1px solid ${T.line}` }}>
                      <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 14, fontWeight: 600 }}>{e.n}</div>
                          <div style={{ fontSize: 13, color: T.muted }}>{e.d}</div>
                          {e.c && <div style={{ fontSize: 12.5, color: T.muted, marginTop: 5, lineHeight: 1.5 }}>{e.c}</div>}
                        </div>
                        <a href={e.v} target="_blank" rel="noreferrer" style={{ color: T.opticDim, fontSize: 12, alignSelf: "flex-start", textDecoration: "none", whiteSpace: "nowrap" }}>
                          ▶ form
                        </a>
                      </div>
                    </div>
                  ))}
                </Card>
              );
            })}

            <SectionLabel>Daily accessories</SectionLabel>
            <Card>
              {ACCESSORIES.map((a, i) => {
                const k = "acc" + i;
                const isDone = todayLog.done.includes(k);
                return (
                  <div
                    key={k}
                    onClick={() => toggleDone(k)}
                    style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 0", borderTop: i ? `1px solid ${T.line}` : "none", cursor: "pointer" }}
                  >
                    <div style={{ width: 18, height: 18, borderRadius: 4, border: `1.5px solid ${isDone ? T.optic : T.muted}`, background: isDone ? T.optic : "transparent", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "#141810", fontSize: 12, fontWeight: 700 }}>
                      {isDone ? "✓" : ""}
                    </div>
                    <div style={{ fontSize: 14, color: isDone ? T.muted : T.chalk, textDecoration: isDone ? "line-through" : "none" }}>
                      {a}
                    </div>
                  </div>
                );
              })}
            </Card>

            <SectionLabel>Session notes</SectionLabel>
            <Card>
              <textarea
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                placeholder="How it went, swaps made, anything for Sunday review…"
                rows={3}
                style={{ width: "100%", background: "transparent", border: "none", outline: "none", color: T.chalk, fontFamily: "'Inter', sans-serif", fontSize: 14, resize: "vertical" }}
              />
              <Btn small onClick={saveNotes} style={{ marginTop: 8 }}>Save notes</Btn>
            </Card>

            <SectionLabel>Photos</SectionLabel>
            <Card>
              <label style={{ display: "inline-block" }}>
                <span style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 13, letterSpacing: "0.06em", textTransform: "uppercase", padding: "8px 14px", borderRadius: 6, cursor: "pointer", background: T.optic, color: "#141810", display: "inline-block" }}>
                  Add photo
                </span>
                <input type="file" accept="image/*" onChange={handlePhoto} style={{ display: "none" }} />
              </label>
              {photos.length === 0 && (
                <div style={{ color: T.muted, fontSize: 13, marginTop: 10 }}>No photos for this day.</div>
              )}
              {photos.length > 0 && (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginTop: 12 }}>
                  {photos.map((p) => (
                    <div key={p.id} style={{ position: "relative" }}>
                      <img src={p.dataUrl} alt="" style={{ width: "100%", borderRadius: 6, display: "block" }} />
                      <button
                        onClick={() => removePhoto(p.id)}
                        style={{ position: "absolute", top: 4, right: 4, background: "rgba(0,0,0,0.65)", color: T.chalk, border: "none", borderRadius: 4, cursor: "pointer", fontSize: 12, padding: "2px 7px" }}
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <div style={{ fontSize: 11, color: T.muted, marginTop: 10 }}>
                Photos are compressed and stored in this browser only.
              </div>
            </Card>
          </>
        )}

        {/* ---------------- PLAN ---------------- */}
        {tab === "plan" && (
          <>
            <SectionLabel>Weekly skeleton</SectionLabel>
            <Card>
              {[
                ["Mon", "Pull"],
                ["Tue", "HIIT (" + hiitLabel + ")"],
                ["Wed", "Legs / Core + Tennis 8pm"],
                ["Thu", "Yoga / Pilates"],
                ["Fri", "Push"],
                ["Sat/Sun", "Tennis OR Long Zone 2 (75-90 min)"],
              ].map(([d, s], i) => (
                <div key={d} style={{ display: "flex", gap: 14, padding: "8px 0", borderTop: i ? `1px solid ${T.line}` : "none" }}>
                  <div style={{ fontFamily: "'Oswald', sans-serif", width: 70, color: T.optic, fontWeight: 600, fontSize: 14, textTransform: "uppercase" }}>{d}</div>
                  <div style={{ fontSize: 14 }}>{s}</div>
                </div>
              ))}
            </Card>

            <SectionLabel>Prescriptions</SectionLabel>
            <Card>
              <div style={{ fontSize: 14, lineHeight: 1.7 }}>
                Zone 2: HR 120-130 (measured). HIIT: HR 157-165 (90-95% of HRmax 174).
                Power cue: 3s eccentric, explosive concentric, every lift.
                Left side always leads; left exercises first when fresh.
                Tennis cap: 2/week until HRV stabilises above 55.
              </div>
            </Card>

            <SectionLabel>Session detail</SectionLabel>
            {["pull", "legs", "push", "hiit44", "hiit1020", "deload", "tennis", "longz2", "yoga"].map((key) => {
              const s = PROG[key];
              const open = planOpen === key;
              const hasOverride = data.overrides && data.overrides[key];
              return (
                <Card key={key} style={{ marginBottom: 10 }}>
                  <div onClick={() => setPlanOpen(open ? null : key)} style={{ display: "flex", justifyContent: "space-between", cursor: "pointer" }}>
                    <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 16, textTransform: "uppercase", letterSpacing: "0.04em" }}>
                      {s.name}{hasOverride ? " •" : ""}
                    </div>
                    <div style={{ color: T.muted }}>{open ? "−" : "+"}</div>
                  </div>
                  {open && editKey !== key && (
                    <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                      <Btn small onClick={() => startEdit(key)}>Edit</Btn>
                      {hasOverride && <Btn small onClick={() => resetEdit(key)}>Reset to default</Btn>}
                    </div>
                  )}
                  {open && editKey === key && (
                    <div style={{ marginTop: 10 }}>
                      {editRows.map((row, i) => (
                        <div key={i} style={{ borderTop: `1px solid ${T.line}`, padding: "10px 0" }}>
                          <input
                            value={row.n}
                            onChange={(ev) => { const r = [...editRows]; r[i] = { ...r[i], n: ev.target.value }; setEditRows(r); }}
                            placeholder="Exercise name"
                            style={inp}
                          />
                          <input
                            value={row.d}
                            onChange={(ev) => { const r = [...editRows]; r[i] = { ...r[i], d: ev.target.value }; setEditRows(r); }}
                            placeholder="Sets / reps / load"
                            style={inp}
                          />
                          <textarea
                            value={row.c || ""}
                            onChange={(ev) => { const r = [...editRows]; r[i] = { ...r[i], c: ev.target.value }; setEditRows(r); }}
                            placeholder="Form cues / instructions"
                            rows={2}
                            style={{ ...inp, resize: "vertical" }}
                          />
                          <Btn small onClick={() => setEditRows(editRows.filter((_, j) => j !== i))}>Remove</Btn>
                        </div>
                      ))}
                      <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                        <Btn small onClick={() => setEditRows([...editRows, { n: "", d: "", c: "", v: yt("exercise form") }])}>+ Add exercise</Btn>
                        <Btn small primary onClick={saveEdit}>Save</Btn>
                        <Btn small onClick={() => setEditKey(null)}>Cancel</Btn>
                      </div>
                    </div>
                  )}
                  {open && editKey !== key &&
                    s.exercises.map((e, i) => (
                      <div key={i} style={{ padding: "8px 0", borderTop: `1px solid ${T.line}`, marginTop: i === 0 ? 10 : 0 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 14, fontWeight: 600 }}>{e.n}</div>
                            <div style={{ fontSize: 13, color: T.muted }}>{e.d}</div>
                            {e.c && <div style={{ fontSize: 12.5, color: T.muted, marginTop: 5, lineHeight: 1.5 }}>{e.c}</div>}
                          </div>
                          <a href={e.v} target="_blank" rel="noreferrer" style={{ color: T.opticDim, fontSize: 12, alignSelf: "flex-start", textDecoration: "none", whiteSpace: "nowrap" }}>▶ form</a>
                        </div>
                      </div>
                    ))}
                </Card>
              );
            })}
          </>
        )}

        {/* ---------------- WEIGHT ---------------- */}
        {tab === "weight" && (
          <>
            <SectionLabel>Weekly weigh-in</SectionLabel>
            <Card>
              <div style={{ display: "flex", gap: 10 }}>
                <input
                  value={weightInput}
                  onChange={(e) => setWeightInput(e.target.value)}
                  placeholder="kg"
                  inputMode="decimal"
                  style={{ flex: 1, background: T.cardAlt, border: `1px solid ${T.line}`, borderRadius: 6, padding: "10px 12px", color: T.chalk, fontSize: 16, outline: "none" }}
                />
                <Btn primary onClick={addWeight}>Log</Btn>
              </div>
              <div style={{ fontSize: 12, color: T.muted, marginTop: 8 }}>
                Target band 82-84 kg (August retest) shown on the chart.
              </div>
            </Card>

            <SectionLabel>Trend</SectionLabel>
            <Card>
              <WeightChart weights={data.weights} />
            </Card>

            {data.weights.length > 0 && (
              <>
                <SectionLabel>Entries</SectionLabel>
                <Card>
                  {[...data.weights]
                    .sort((a, b) => b.date.localeCompare(a.date))
                    .map((w, i) => (
                      <div key={w.date} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderTop: i ? `1px solid ${T.line}` : "none", fontSize: 14 }}>
                        <span style={{ color: T.muted }}>{w.date}</span>
                        <span>{w.kg.toFixed(1)} kg</span>
                      </div>
                    ))}
                </Card>
              </>
            )}
          </>
        )}

        {/* ---------------- HISTORY ---------------- */}
        {tab === "history" && (
          <>
            <SectionLabel>Session log</SectionLabel>
            {Object.keys(data.sessions).length === 0 && (
              <div style={{ color: T.muted, fontSize: 14 }}>Nothing logged yet.</div>
            )}
            {Object.entries(data.sessions)
              .sort((a, b) => b[0].localeCompare(a[0]))
              .slice(0, 30)
              .map(([date, s]) => (
                <Card key={date} style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 15 }}>{date}</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {s.done.filter((d) => !d.startsWith("acc")).map((d) => (
                        <Chip key={d} active>{PROG[d] ? PROG[d].name : d}</Chip>
                      ))}
                    </div>
                  </div>
                  {s.notes && <div style={{ fontSize: 13, color: T.muted }}>{s.notes}</div>}
                </Card>
              ))}
          </>
        )}

        {/* ---------------- SETTINGS ---------------- */}
        {tab === "settings" && (
          <>
            <SectionLabel>Week 1 anchor (Monday)</SectionLabel>
            <Card>
              <div style={{ fontSize: 13, color: T.muted, marginBottom: 10, lineHeight: 1.5 }}>
                Drives odd/even HIIT parity (odd = Norwegian 4×4, even = 10-20-30) and the
                week-8 deload. Set it to the Monday your current cycle started.
              </div>
              <input
                type="date"
                defaultValue={data.settings.anchorDate}
                onChange={(e) => e.target.value && setAnchor(e.target.value)}
                style={{ background: T.cardAlt, border: `1px solid ${T.line}`, borderRadius: 6, padding: "10px 12px", color: T.chalk, fontSize: 15, outline: "none", width: "100%" }}
              />
              <div style={{ fontSize: 13, marginTop: 10, color: data.settings.anchorConfirmed ? T.optic : T.danger }}>
                {data.settings.anchorConfirmed ? "Confirmed" : "Unconfirmed default (22 Jun 2026)"}
              </div>
            </Card>

            <SectionLabel>About</SectionLabel>
            <Card>
              <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.6 }}>
                Seeded from Master_Context_Briefing V20 §14.6 (protocol updated 20 Jun 2026).
                Navigate to any date on the Today tab to view, log, or backfill that day.
                Edit any session's exercises on the Plan tab (edited sessions show a • mark).
                Logging here is raw training data only; Sunday reflective review stays in Notion.
                Data and photos are stored in this browser only — they will not sync
                between your phone and laptop. Each device keeps its own log.
              </div>
            </Card>
          </>
        )}
      </div>

      {/* Bottom tab bar */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: T.card, borderTop: `1px solid ${T.line}` }}>
        <div style={{ maxWidth: 480, margin: "0 auto", display: "flex" }}>
          {TABS.map(([k, label]) => (
            <button
              key={k}
              onClick={() => setTab(k)}
              style={{
                flex: 1, padding: "14px 4px", background: "transparent", border: "none", cursor: "pointer",
                fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 12, letterSpacing: "0.08em",
                textTransform: "uppercase",
                color: tab === k ? T.optic : T.muted,
                borderTop: tab === k ? `2px solid ${T.optic}` : "2px solid transparent",
              }}
            >
              {label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TrainingTracker />);
</script>
</body>
</html>
